version: "3.8"

services:
    laravel-php:
        build:
            context: .
            dockerfile: Dockerfile
        shm_size: "256mb"
        image: facturacion-laravel-php:latest
        container_name: laravel-php
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
        ports:
            - "9000:9000"
        networks:
            - laravel-net
        depends_on:
            laravel-db:
                condition: service_healthy
        # ✅ HEALTHCHECK AGREGADO - Verifica que PHP-FPM esté listo
        healthcheck:
            test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 40s
        environment:
            # ✅ Variables para mejorar estabilidad de PHP-FPM
            PHP_FPM_PM: dynamic
            PHP_FPM_PM_MAX_CHILDREN: 10
            PHP_FPM_PM_START_SERVERS: 2
            PHP_FPM_PM_MIN_SPARE_SERVERS: 1
            PHP_FPM_PM_MAX_SPARE_SERVERS: 3
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 512M # ✅ Aumentado de 384M
                reservations:
                    memory: 256M # ✅ Aumentado de 128M

    laravel-db:
        image: mysql:8.0.34
        container_name: laravel-db
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: factuZen_pass_root
            MYSQL_DATABASE: factuZen_db
            MYSQL_USER: factuZen_user
            MYSQL_PASSWORD: factuZen_pass
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - laravel-net
        ports:
            - "3307:3306"
        command: --default-authentication-plugin=mysql_native_password --max_connections=100
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M
                reservations:
                    memory: 128M
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "root",
                    "-pfactuZen_pass_root",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    laravel-queue:
        image: facturacion-laravel-php:latest
        container_name: laravel-queue
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
        depends_on:
            laravel-php:
                condition: service_healthy # ✅ Espera a que PHP-FPM esté listo
            laravel-db:
                condition: service_healthy
        networks:
            - laravel-net
        command: sh -c "sleep 30 && php artisan storage:link && php artisan queue:work --sleep=3 --tries=3"
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M
                reservations:
                    memory: 128M

    vite:
        image: node:20-alpine
        container_name: laravel-vite
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
            - node_modules:/var/www/node_modules
        ports:
            - "5173:5173"
        networks:
            - laravel-net
        command: sh -c "npm ci --prefer-offline --no-audit || npm install && npm install react react-dom @vitejs/plugin-react && npm run build && sleep infinity"
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 384M
                reservations:
                    memory: 128M

volumes:
    db_data:
    node_modules:

networks:
    laravel-net:
        driver: bridge
